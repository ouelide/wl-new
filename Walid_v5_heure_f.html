<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#efd8e8"><title>Walid — maquette animée</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#30333b}body{background:linear-gradient(145deg,#f0d5e6,#ead0e4 48%,#f4dfea);min-height:100dvh;overflow:hidden}.screen{height:100dvh;min-height:600px;position:relative;padding:env(safe-area-inset-top) 17px env(safe-area-inset-bottom);display:flex;flex-direction:column}.nav{height:72px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;position:relative}.back{position:absolute;left:10px;font-size:36px;font-weight:200;top:12px}.card{position:relative;isolation:isolate;flex:1;min-height:0;border-radius:22px;background:rgba(255,241,251,.30);box-shadow:0 2px 12px #9e829018,0 1px 2px #70556f13;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 10px 50px;overflow:hidden}.card:before{content:"";position:absolute;left:-16px;top:2%;height:25%;width:21px;background:#2a6979;transform:skewY(36deg)}.screen::after{content:"";position:absolute;z-index:0;pointer-events:none;right:0;bottom:9%;width:clamp(52px,12vw,78px);height:clamp(160px,21vh,225px);background:#2a6979;clip-path:polygon(72% 0%,100% 14%,100% 100%,0% 78%)}.nav,.card,.footer{z-index:1}.title{font-size:clamp(23px,7vw,36px);font-weight:650;text-align:center;letter-spacing:-.8px;margin:0 0 25px}.avatar-box{height:clamp(170px,50vw,250px);width:clamp(170px,50vw,250px);position:relative;display:grid;place-items:center;margin-bottom:18px}.avatar{width:79%;height:79%;object-fit:cover;border-radius:50%;z-index:3;border:1.5px solid #274c42}.wave{position:absolute;inset:8%;border:15px solid rgba(61,103,77,.45);border-radius:50%;opacity:0;transform:scale(.88);filter:blur(1px);animation:pulse 2.95s ease-out infinite}.wave.two{animation-delay:.36s}@keyframes pulse{0%,5%{opacity:0;transform:scale(.86)}12%{opacity:.73;transform:scale(1)}32%{opacity:.36;transform:scale(1.10)}51%,100%{opacity:0;transform:scale(1.20)}}.name{font-size:clamp(24px,6vw,32px);font-weight:650;letter-spacing:-.8px;text-align:center}.venue{font-size:clamp(14px,3.7vw,18px);margin-top:10px;text-align:center}.date{font-size:16px;margin-top:15px;text-align:center;color:#50505a}.footer{height:95px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;letter-spacing:6px}.footer small{font-size:13px}.footer b{font-size:22px;font-weight:400;letter-spacing:5px}.flag{position:absolute;z-index:6;left:50%;bottom:7px;transform:translateX(-50%);white-space:nowrap;font-size:9px;font-weight:500;letter-spacing:.15px;color:#6a5365;background:rgba(255,248,253,.78);padding:3px 6px;border-radius:4px;text-align:center}@media(max-height:740px){.nav{height:55px}.footer{height:68px}.card{padding-bottom:42px}.title{margin-bottom:10px}.avatar-box{height:190px;width:190px;margin-bottom:5px}}@media(prefers-reduced-motion:reduce){.wave{animation:none;opacity:.4;transform:scale(1)}}

/* Alignement de la maquette sur la capture de référence */
.card{overflow:visible;background:rgba(255,241,251,.35)}
.card::before{content:"";position:absolute;z-index:1;left:-17px;top:2%;height:26%;width:23px;background:#2b7480;transform:none;clip-path:polygon(0 0,100% 8%,100% 100%,0 89%);pointer-events:none}
.card::after{z-index:-1}
.title{font-weight:650;letter-spacing:-1px}
.venue{color:#57515a}
.footer{letter-spacing:5px}
.footer small{font-size:13px;letter-spacing:7px}
.footer b{font-size:23px;letter-spacing:5px}
.flag{bottom:9px}

/* Barre droite : bornes et inclinaisons conformes aux repères rouges.
   Elle part derrière le coin inférieur droit de la carte et ne descend
   que de 55px sous celle-ci, sans former un grand pavé vertical. */
.screen::after{display:none!important}
.card::after{
  content:"";
  position:absolute;
  display:block;
  right:-17px;
  bottom:-55px;
  width:clamp(65px,12vw,86px);
  height:215px;
  background:#2b7480;
  clip-path:polygon(76% 0,100% 17%,100% 100%,0 72%);
  transform:none;
  pointer-events:none;
  z-index:-1;
}

/* Ruban vert droit fin, majoritairement masque par la carte rose. */
.card{background:#f2dce9;isolation:auto}
.card::after{
  content:"";position:absolute;right:-17px;bottom:-31px;
  width:55px;height:190px;
  background:#2b7480;
  clip-path:polygon(70% 0,100% 13%,100% 100%,0 84%);
  transform:none;z-index:-1;pointer-events:none;
}
/* Version blanche : mêmes proportions et ruban derrière le cadre. */
html,body{background:#fff!important}
.card{background:#fff!important;box-shadow:0 3px 17px rgba(40,54,60,.12),0 0 1px rgba(40,54,60,.15)}
.flag{background:#f5f5f5;color:#666}

/* Ajustement du ruban en bas à droite : plus fin et derrière le cadre blanc. */
.card{isolation:auto;overflow:visible;position:relative;z-index:1}
.card::after{
  content:"";
  position:absolute;
  right:-17px;
  bottom:-30px;
  width:43px;
  height:158px;
  background:#2b7480;
  clip-path:polygon(72% 0,100% 16%,100% 100%,0 80%);
  transform:none;
  z-index:-1;
  pointer-events:none;
}

/* Coin du ruban droit arrondi : courbe rentrante type porte-manteau.
   La surface principale reste derrière la carte blanche. */
.card::after{
  content:"";
  position:absolute;
  right:-24px;
  bottom:-32px;
  width:76px;
  height:195px;
  background:#2b7480;
  clip-path:path("M 49 0 L 76 34 L 76 195 L 0 161 L 20 161 C 36 161 49 144 49 126 L 49 0 Z");
  z-index:-1;
  pointer-events:none;
  transform:none;
}

/* Derniers ajustements : ruban un peu moins haut et halo plus ample/rapide. */
.card::after{
  height:175px;
  clip-path:path("M 49 0 L 76 34 L 76 175 L 0 145 L 20 145 C 36 145 49 128 49 110 L 49 0 Z");
}
.wave{
  animation-duration:2.05s;
  filter:blur(2px);
}
.wave.two{animation-delay:.30s}
@keyframes pulse{
  0%,5%{opacity:0;transform:scale(.86)}
  12%{opacity:.73;transform:scale(1)}
  34%{opacity:.34;transform:scale(1.16)}
  55%,100%{opacity:0;transform:scale(1.30)}
}
@media(prefers-reduced-motion:reduce){.wave{animation:none;opacity:.4;transform:scale(1)}}
